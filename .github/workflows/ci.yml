name: CI

on:
  push:
    branches:
      - next
      - master
  pull_request:
    # labeled: adding the e2e:runtime label starts the runtime job on a pull request.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Dependency checks
        run: npm run lint:deps

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: packages/*/coverage/lcov.info
          if-no-files-found: ignore

  # Pinned dependency mode (Plan 4 section 3): babel, packaging, compiler builds and examples, starter CLI, generation
  # and project quality, tester examples. No browser.
  e2e-pinned:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: E2E (pinned)
        run: npm run e2e

      - name: Tester examples
        run: npx lerna run test --scope='@rockpack/example-tester-*'

  # Browser and dev-server checks: on pushes to next, on manual runs and on pull requests labelled e2e:runtime.
  e2e-runtime:
    needs: check
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/next') ||
      contains(github.event.pull_request.labels.*.name, 'e2e:runtime')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chrome
        run: npx puppeteer browsers install chrome

      - name: E2E (runtime)
        run: npm run e2e:runtime
