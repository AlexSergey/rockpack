name: Deploy GitHub Pages

# The site is built from book/ at deploy time; docs/ is build output and not committed (Plan 3 R1).
on:
  push:
    branches:
      - master
    paths:
      - 'book/**'
      - 'packages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build packages
        run: npm run build

      # The book prerenders its page with puppeteer's headless Chrome.
      - name: Install Chrome
        run: npm exec -w book -- puppeteer browsers install chrome

      - name: Build book
        run: npm run build -w book

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
